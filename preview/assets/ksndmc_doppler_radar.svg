<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke="#111111" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="ksndmc-radar-vector">
  <!-- KSNDMC Bengaluru Doppler Precipitation Radar Scanner -->
  
  <defs>
    <!-- Radar Sector Sweep Gradient (Monochrome subtle opacity cone) -->
    <linearGradient id="radarSweepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Outer Ring (50 KM Range) -->
  <circle cx="80" cy="80" r="72" stroke="#111111" stroke-width="1.5" />
  <circle cx="80" cy="80" r="52" stroke="#787774" stroke-width="0.75" stroke-dasharray="3,3" />
  <circle cx="80" cy="80" r="32" stroke="#787774" stroke-width="0.75" stroke-dasharray="3,3" />
  <circle cx="80" cy="80" r="12" stroke="#111111" stroke-width="1" />

  <!-- Cardinal Axes & Crosshairs -->
  <line x1="80" y1="5" x2="80" y2="155" stroke="#787774" stroke-width="0.75" />
  <line x1="5" y1="80" x2="155" y2="80" stroke="#787774" stroke-width="0.75" />
  
  <!-- Degree Ticks -->
  <line x1="80" y1="8" x2="80" y2="14" stroke="#111111" stroke-width="1.5" />
  <line x1="80" y1="146" x2="80" y2="152" stroke="#111111" stroke-width="1.5" />
  <line x1="8" y1="80" x2="14" y2="80" stroke="#111111" stroke-width="1.5" />
  <line x1="146" y1="80" x2="152" y2="80" stroke="#111111" stroke-width="1.5" />

  <!-- Compass Cardinal Headings -->
  <text x="80" y="20" font-family="'JetBrains Mono', monospace" font-size="5" text-anchor="middle" font-weight="600" fill="#111111">N</text>
  <text x="144" y="82" font-family="'JetBrains Mono', monospace" font-size="5" text-anchor="middle" font-weight="600" fill="#111111">E</text>
  <text x="80" y="145" font-family="'JetBrains Mono', monospace" font-size="5" text-anchor="middle" font-weight="600" fill="#111111">S</text>
  <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="5" text-anchor="middle" font-weight="600" fill="#111111">W</text>

  <!-- KSNDMC Rotating Radar Beam (GSAP Rotation target: 360deg loop) -->
  <g id="radar-sweep-beam" class="gsap-radar-sweep" transform-origin="80 80">
    <path d="M 80 80 L 152 80 A 72 72 0 0 0 130 30 Z" fill="url(#radarSweepGradient)" stroke="none" />
    <line x1="80" y1="80" x2="152" y2="80" stroke="#111111" stroke-width="1.5" />
  </g>

  <!-- Bellandur Cloudburst Cell (H3 Hexagon & Hotspot Ping) -->
  <g class="gsap-cloudburst-hotspot">
    <!-- Hexagonal H3 Cell boundary -->
    <polygon points="105,62 115,56 125,62 125,74 115,80 105,74" fill="#111111" fill-opacity="0.15" stroke="#111111" stroke-width="1.5" />
    <circle cx="115" cy="68" r="3" fill="#111111" />
    <circle cx="115" cy="68" r="8" stroke="#111111" stroke-width="1" class="gsap-ping-ring" />
    <circle cx="115" cy="68" r="14" stroke="#787774" stroke-width="0.75" stroke-dasharray="2,2" class="gsap-ping-ring-outer" />
  </g>

  <!-- Telemetry Monospace Text -->
  <text x="80" y="98" font-family="'JetBrains Mono', monospace" font-size="4.5" text-anchor="middle" fill="#111111" font-weight="600">82.4 MM/HR</text>
  <text x="80" y="105" font-family="'JetBrains Mono', monospace" font-size="3.5" text-anchor="middle" fill="#787774">BELLANDUR DOWNSPOUR</text>
</svg>
