<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="rajakaluve-vector">
  <!-- Bangalore Rajakaluve Primary Stormwater Canal Conduit & Sensor Diagram -->
  
  <!-- Ground Stratum & Embankment -->
  <path d="M 10 25 L 90 25 L 110 50 L 110 115 L 290 115 L 290 50 L 310 25 L 350 25" fill="#F7F6F3" stroke="#111111" stroke-width="2" />
  
  <!-- Soil Strata Hash Marks -->
  <line x1="15" y1="20" x2="25" y2="10" stroke="#787774" stroke-width="0.75" />
  <line x1="35" y1="20" x2="45" y2="10" stroke="#787774" stroke-width="0.75" />
  <line x1="55" y1="20" x2="65" y2="10" stroke="#787774" stroke-width="0.75" />
  <line x1="315" y1="20" x2="325" y2="10" stroke="#787774" stroke-width="0.75" />
  <line x1="335" y1="20" x2="345" y2="10" stroke="#787774" stroke-width="0.75" />

  <!-- Reinforced Concrete Bed Lining -->
  <rect x="105" y="115" width="190" height="8" fill="#111111" />

  <!-- Silt / Sediment Layer (Bottom 25cm Obstruction) -->
  <path d="M 110 115 L 110 98 Q 200 94 290 102 L 290 115 Z" fill="#EAEAEA" stroke="#111111" stroke-width="1" stroke-dasharray="2,2" class="gsap-silt-layer" />
  <text x="200" y="108" font-family="'JetBrains Mono', monospace" font-size="4.5" fill="#787774" text-anchor="middle">SILT &amp; DETRITUS: 32CM ACCUMULATION</text>

  <!-- Trash Screen / Culvert Metal Grate (Left Intake) -->
  <line x1="110" y1="50" x2="125" y2="115" stroke="#111111" stroke-width="2" />
  <line x1="115" y1="50" x2="130" y2="115" stroke="#111111" stroke-width="2" />
  <line x1="120" y1="50" x2="135" y2="115" stroke="#111111" stroke-width="2" />
  
  <!-- Dynamic Water Surface Wave (Scrubbable / Animated) -->
  <path d="M 125 65 C 160 62, 190 68, 225 64 C 255 60, 275 66, 290 65" stroke="#111111" stroke-width="2" class="gsap-water-surface" />
  
  <!-- Animated Flow Streamlines (stroke-dashoffset animation via GSAP) -->
  <path d="M 135 75 L 285 75" stroke="#111111" stroke-width="1.5" stroke-dasharray="8,6" class="gsap-streamline-1" />
  <path d="M 130 85 L 285 85" stroke="#111111" stroke-width="1.5" stroke-dasharray="12,8" class="gsap-streamline-2" />
  <path d="M 135 93 L 280 93" stroke="#787774" stroke-width="1" stroke-dasharray="6,6" class="gsap-streamline-3" />

  <!-- Ultrasonic Silt & Water Depth Sensor (BBMP IoT Unit S1-SD) -->
  <rect x="190" y="32" width="20" height="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />
  <text x="200" y="40" font-family="'JetBrains Mono', monospace" font-size="4" font-weight="600" text-anchor="middle" fill="#111111">S1-SD</text>
  <line x1="200" y1="25" x2="200" y2="32" stroke="#111111" stroke-width="1.5" />
  <circle cx="200" cy="24" r="1.5" fill="#111111" />
  <!-- Ultrasonic Acoustic Pings radiating down -->
  <path d="M 194 48 C 197 51, 203 51, 206 48" stroke="#111111" stroke-width="1" class="gsap-sensor-ping-1" />
  <path d="M 190 53 C 196 57, 204 57, 210 53" stroke="#111111" stroke-width="1" class="gsap-sensor-ping-2" />

  <!-- Overflow Crest / High Water Line Indicator -->
  <line x1="90" y1="52" x2="310" y2="52" stroke="#111111" stroke-width="0.75" stroke-dasharray="4,4" />
  <rect x="10" y="47" width="75" height="10" fill="#FFFFFF" stroke="#111111" stroke-width="1" />
  <text x="47" y="54" font-family="'JetBrains Mono', monospace" font-size="4" text-anchor="middle" fill="#111111" font-weight="600">CRITICAL OVERFLOW +919.5M</text>

  <!-- Flow Direction Vector Arrows -->
  <polygon points="275,72 285,75 275,78" fill="#111111" />
  <polygon points="275,82 285,85 275,88" fill="#111111" />

  <!-- Bottom Legend / Swiss Meta Callout -->
  <text x="10" y="134" font-family="'JetBrains Mono', monospace" font-size="4.5" fill="#787774">BELLANDUR MAIN DRAIN · CATCHMENT CODE: SWD-BLR-150 · DISCHARGE: 42 M³/SEC</text>
</svg>
