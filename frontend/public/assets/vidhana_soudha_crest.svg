<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="vidhana-soudha-vector">
  <!-- Vidhana Soudha Architectural Crest - Bengaluru Seat of Governance -->
  
  <!-- Foundation & Grand Steps -->
  <line x1="10" y1="130" x2="190" y2="130" stroke-width="2" />
  <line x1="20" y1="126" x2="180" y2="126" stroke-width="1" />
  <line x1="30" y1="122" x2="170" y2="122" stroke-width="1" />
  <line x1="40" y1="118" x2="160" y2="118" stroke-width="1" />
  
  <!-- Central Grand Flight of Stairs -->
  <polygon points="75,130 125,130 120,114 80,114" fill="#F7F6F3" stroke="#111111" stroke-width="1" />
  <line x1="77" y1="126" x2="123" y2="126" stroke-width="0.75" />
  <line x1="79" y1="122" x2="121" y2="122" stroke-width="0.75" />
  <line x1="81" y1="118" x2="119" y2="118" stroke-width="0.75" />

  <!-- Lower Base Plinth -->
  <rect x="25" y="106" width="150" height="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.25" />

  <!-- Side Wings Facade & Columns -->
  <!-- Left Wing -->
  <rect x="28" y="70" width="46" height="36" fill="#FFFFFF" stroke="#111111" stroke-width="1" />
  <line x1="36" y1="70" x2="36" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="44" y1="70" x2="44" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="52" y1="70" x2="52" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="60" y1="70" x2="60" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="68" y1="70" x2="68" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <!-- Left Wing Windows -->
  <circle cx="36" cy="80" r="2.5" fill="#111111" />
  <circle cx="44" cy="80" r="2.5" fill="#111111" />
  <circle cx="52" cy="80" r="2.5" fill="#111111" />
  <circle cx="60" cy="80" r="2.5" fill="#111111" />
  <circle cx="68" cy="80" r="2.5" fill="#111111" />

  <!-- Right Wing -->
  <rect x="126" y="70" width="46" height="36" fill="#FFFFFF" stroke="#111111" stroke-width="1" />
  <line x1="134" y1="70" x2="134" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="142" y1="70" x2="142" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="150" y1="70" x2="150" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="158" y1="70" x2="158" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="166" y1="70" x2="166" y2="106" stroke-width="1" stroke-dasharray="2,2" />
  <!-- Right Wing Windows -->
  <circle cx="134" cy="80" r="2.5" fill="#111111" />
  <circle cx="142" cy="80" r="2.5" fill="#111111" />
  <circle cx="150" cy="80" r="2.5" fill="#111111" />
  <circle cx="158" cy="80" r="2.5" fill="#111111" />
  <circle cx="166" cy="80" r="2.5" fill="#111111" />

  <!-- Left Cupola Dome -->
  <rect x="25" y="66" width="12" height="4" fill="#FFFFFF" stroke="#111111" stroke-width="1" />
  <path d="M 27 66 C 27 56, 35 56, 35 66 Z" fill="#F7F6F3" stroke="#111111" stroke-width="1" />
  <line x1="31" y1="56" x2="31" y2="52" stroke-width="1.25" />
  <circle cx="31" cy="51" r="1" fill="#111111" />

  <!-- Right Cupola Dome -->
  <rect x="163" y="66" width="12" height="4" fill="#FFFFFF" stroke="#111111" stroke-width="1" />
  <path d="M 165 66 C 165 56, 173 56, 173 66 Z" fill="#F7F6F3" stroke="#111111" stroke-width="1" />
  <line x1="169" y1="56" x2="169" y2="52" stroke-width="1.25" />
  <circle cx="169" cy="51" r="1" fill="#111111" />

  <!-- Central Portico & Pillars -->
  <rect x="74" y="65" width="52" height="41" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />
