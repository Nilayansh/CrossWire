  <line x1="79" y1="67" x2="79" y2="106" stroke-width="1.5" />
  <line x1="87" y1="67" x2="87" y2="106" stroke-width="1.5" />
  <line x1="95" y1="67" x2="95" y2="106" stroke-width="1.5" />
  <line x1="105" y1="67" x2="105" y2="106" stroke-width="1.5" />
  <line x1="113" y1="67" x2="113" y2="106" stroke-width="1.5" />
  <line x1="121" y1="67" x2="121" y2="106" stroke-width="1.5" />

  <!-- Central Arch / Entry Door -->
  <path d="M 96 106 L 96 92 C 96 89, 104 89, 104 92 L 104 106 Z" fill="#111111" />

  <!-- Pediment Architrave with Inscription Bar -->
  <polygon points="70,65 130,65 124,55 76,55" fill="#F7F6F3" stroke="#111111" stroke-width="1.5" />
  <line x1="78" y1="60" x2="122" y2="60" stroke-width="0.75" />

  <!-- Neo-Dravidian Central Drum & Balcony -->
  <rect x="84" y="47" width="32" height="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.25" />
  <line x1="88" y1="47" x2="88" y2="55" stroke-width="1" />
  <line x1="94" y1="47" x2="94" y2="55" stroke-width="1" />
  <line x1="100" y1="47" x2="100" y2="55" stroke-width="1" />
  <line x1="106" y1="47" x2="106" y2="55" stroke-width="1" />
  <line x1="112" y1="47" x2="112" y2="55" stroke-width="1" />

  <!-- Central Grand Dome (Iconic Bulbous Dome) -->
  <path d="M 85 47 C 82 28, 118 28, 115 47 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.75" class="gsap-dome" />
  <path d="M 90 47 C 88 32, 112 32, 110 47" stroke="#111111" stroke-width="0.75" />
  <path d="M 95 47 C 94 36, 106 36, 105 47" stroke="#111111" stroke-width="0.75" />

  <!-- Ashoka Four Lions Capital / Stupa Finial -->
  <rect x="97" y="23" width="6" height="5" fill="#111111" />
  <line x1="100" y1="23" x2="100" y2="12" stroke-width="1.5" />
  <!-- Ashoka Lions Crest Silhouette -->
  <circle cx="100" cy="11" r="3" fill="#111111" />
  <path d="M 96 11 L 100 6 L 104 11 Z" fill="#111111" />

  <!-- Corner Ornamental Chhatris -->
  <line x1="72" y1="55" x2="72" y2="48" stroke-width="1" />
  <circle cx="72" cy="47" r="1.5" fill="#111111" />
  <line x1="128" y1="55" x2="128" y2="48" stroke-width="1" />
  <circle cx="128" cy="47" r="1.5" fill="#111111" />

  <!-- Minimalist Aesthetic Compass / Subtext Mark -->
  <text x="100" y="138" font-family="'JetBrains Mono', monospace" font-size="5" text-anchor="middle" fill="#787774" letter-spacing="1.5">VIDHANA SOUDHA · BENGALURU</text>
</svg>
